<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publishing registration – PLAIGROUND</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
</head>
<body>
  <div class="flow-top">
    <a class="logo" href="dashboard.html"><img src="assets/plaiground-logo.png" alt="PLAIGROUND" /></a>
    <a class="who" href="settings.html"><span class="avatar">VV</span> Hi Victoria!</a>
  </div>
  <main class="page wrap-wide">
    <div class="page-head">
      <p class="kicker">Publishing</p>
      <h1>Publishing registration</h1>
      <p>PLAIGROUND LLC is appointed publisher of record for this work, at 100% of the publisher’s half. Your writer share is unaffected.</p>
    </div>
    <section class="flow-card">
      <h3>Work</h3>
      <div class="rel">
        <span class="thumb"></span>
        <div>
          <b>Neon Shadows</b>
          <small>Victoria Reyes · Single</small>
        </div>
      </div>
      <div class="form-grid" style="margin-top:18px">
        <div class="field"><label>PRO</label><input value="BMI" /></div>
        <div class="field"><label>IPI</label><input placeholder="Optional until on file" /></div>
      </div>
    </section>
    <div class="flow-actions">
      <a class="btn btn-ghost btn-md" href="publishing.html">Back</a>
      <a class="btn btn-purple btn-md" href="publishing-confirm.html">Submit registration</a>
    </div>
  </main>
</body>
</html>
