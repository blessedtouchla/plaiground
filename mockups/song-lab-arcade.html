<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Song Lab arcade mockup</title>
<style>
  @font-face {
    font-family: Satoshi;
    src: url("../assets/fonts/satoshi-500.woff2") format("woff2");
    font-weight: 500;
    font-display: swap;
  }
  :root {
    --pink: #D03083;
    --gold: #F3CB47;
    --purple: #782FB1;
    --green: #61B63A;
    --orange: #F09416;
    --ink: #f4f4f4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #050505; color: var(--ink); font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
  button {
    font: inherit;
    color: #fff;
    background: #000;
    border: 1px solid rgba(255,255,255,.4);
    cursor: pointer;
    touch-action: manipulation;
  }
  button.on {
    color: #000;
    background: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 0 14px rgba(243, 203, 71, .85);
  }
  button:active { background: #fff; color: #000; }
  @media (hover: hover) {
    button:hover { filter: brightness(1.15); }
  }
  .cabinet {
    min-height: 100vh;
    padding: 18px 16px 32px;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(120, 47, 177, .35), transparent 50%),
      radial-gradient(80% 50% at 100% 100%, rgba(208, 48, 131, .22), transparent 45%),
      #050505;
  }
  .bezel {
    max-width: 1180px;
    margin: 0 auto;
    border: 1px solid rgba(243, 203, 71, .55);
    box-shadow: 0 0 0 8px #0a0a0a, 0 0 40px rgba(208, 48, 131, .25), inset 0 0 40px rgba(120, 47, 177, .18);
    background: #000;
    position: relative;
    overflow: hidden;
  }
  .bezel::after {
    content: "";
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.045) 0 1px, transparent 1px 3px);
    mix-blend-mode: screen;
    z-index: 4;
  }
  header.top {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 14px 16px 16px;
    border-bottom: 2px solid var(--gold);
    background:
      radial-gradient(circle at 8px 8px, var(--pink) 0 3px, transparent 4px) 0 0 / 22px 18px repeat-x,
      linear-gradient(#140816, #050505);
    box-shadow: 0 0 24px rgba(243, 203, 71, .35), inset 0 -8px 20px rgba(208, 48, 131, .25);
  }
  header.top img { height: 46px; width: auto; display: block; filter: drop-shadow(0 0 8px rgba(208, 48, 131, .45)); }
  .marquee-name {
    margin: 0;
    text-align: center;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .28em;
    font-size: 13px;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(243, 203, 71, .9), 0 0 22px rgba(208, 48, 131, .55);
  }
  .tokens { text-align: right; }
  .tokens span {
    display: block;
    margin-bottom: 4px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .22em;
    font-size: 11px;
    color: var(--gold);
  }
  .readout { display: inline-flex; gap: 6px; }
  .seg { position: relative; width: 22px; height: 40px; display: inline-block; }
  .seg i { position: absolute; background: rgba(243, 203, 71, .16); }
  .seg i.a, .seg i.g, .seg i.d { height: 4px; left: 4px; right: 4px; border-radius: 2px; }
  .seg i.a { top: 0; }
  .seg i.g { top: 18px; }
  .seg i.d { bottom: 0; }
  .seg i.b, .seg i.c, .seg i.f, .seg i.e { width: 4px; border-radius: 2px; }
  .seg i.b, .seg i.f { top: 2px; height: 16px; }
  .seg i.c, .seg i.e { bottom: 2px; height: 16px; }
  .seg i.b, .seg i.c { right: 0; }
  .seg i.f, .seg i.e { left: 0; }
  .seg[data-d="1"] i.b, .seg[data-d="1"] i.c,
  .seg[data-d="2"] i.a, .seg[data-d="2"] i.b, .seg[data-d="2"] i.d, .seg[data-d="2"] i.e, .seg[data-d="2"] i.g {
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
  }
  .notes { margin: 0; line-height: 1.45; color: rgba(244,244,244,.9); }
  .focus { display: flex; gap: 8px; }
  .focus button { flex: 1; min-height: 44px; }
  main { position: relative; z-index: 1; padding: 20px 16px 28px; }
  h1, h2, .door b, .kicker { font-family: Satoshi, Inter, sans-serif; font-weight: 500; }
  h1 { margin: 0 0 8px; font-size: 40px; letter-spacing: -.03em; }
  .lede { margin: 0 0 22px; color: rgba(244,244,244,.72); }
  .sounds { display: grid; gap: 10px; margin: 0 0 18px; }
  .sound {
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    text-align: left;
    background: #000;
    border: 1px solid var(--gold);
    box-shadow: 0 0 14px rgba(243, 203, 71, .45), inset 0 0 18px rgba(208, 48, 131, .12);
  }
  .sound:nth-child(2) { border-color: var(--orange); box-shadow: 0 0 14px rgba(240, 148, 22, .5); }
  .sound:nth-child(3) { border-color: var(--green); box-shadow: 0 0 14px rgba(97, 182, 58, .45); }
  .sound b { display: block; font-size: 16px; color: #fff; }
  .sound span { color: rgba(244,244,244,.7); font-size: 13px; }
  .doors { display: grid; gap: 12px; }
  .door {
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: #000;
    border: 1px solid rgba(255,255,255,.35);
    text-align: left;
  }
  .door b { display: block; font-size: 20px; }
  .door span { color: rgba(244,244,244,.65); font-size: 14px; }
  .door i {
    width: 14px; height: 14px; flex: 0 0 14px;
    box-shadow: 0 0 10px currentColor;
    background: currentColor;
  }
  .door:nth-child(1) { border-color: var(--pink); box-shadow: 0 0 16px rgba(208, 48, 131, .55); }
  .door:nth-child(2) { border-color: var(--gold); box-shadow: 0 0 16px rgba(243, 203, 71, .45); }
  .door:nth-child(3) { border-color: var(--purple); box-shadow: 0 0 16px rgba(120, 47, 177, .65); }
  .door:nth-child(1) i { color: var(--pink); }
  .door:nth-child(2) i { color: var(--gold); }
  .door:nth-child(3) i { color: var(--purple); }
  .console {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr) 250px;
    gap: 16px;
    align-items: start;
  }
  .rack, .booth, .sheet {
    border: 1px solid rgba(243, 203, 71, .45);
    padding: 12px;
    background: rgba(0,0,0,.72);
    box-shadow: inset 0 0 24px rgba(120, 47, 177, .18), 0 0 18px rgba(208, 48, 131, .12);
  }
  .booth { border-color: var(--purple); box-shadow: inset 0 0 24px rgba(120, 47, 177, .28), 0 0 16px rgba(120, 47, 177, .35); }
  .sheet { border-color: var(--pink); }
  .kicker {
    margin: 10px 0 6px;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .dial {
    width: 168px;
    height: 168px;
    margin: 36px auto 18px;
    position: relative;
    border-radius: 50%;
    border: 2px solid var(--gold);
    box-shadow: 0 0 18px rgba(243, 203, 71, .45), inset 0 0 24px rgba(208, 48, 131, .35);
  }
  .dial button {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 72px;
    min-height: 44px;
    margin: -22px 0 0 -36px;
    background: transparent;
    border: 0;
    font-size: 12px;
    letter-spacing: .04em;
    transform: rotate(calc(var(--i) * 60deg)) translateY(-96px) rotate(calc(var(--i) * -60deg));
  }
  .dial button.on { color: var(--pink); text-shadow: 0 0 8px var(--pink); }
  .knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 58px;
    height: 58px;
    margin: -29px 0 0 -29px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, var(--purple) 42%, #111 70%);
    box-shadow: 0 0 16px rgba(120, 47, 177, .8);
    transform: rotate(var(--turn));
  }
  .knob::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 6px;
    width: 3px;
    height: 14px;
    margin-left: -1.5px;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
  }
  .pills, .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .pills button, .opts button, .tabs button, .drawer button, .phone button, .punch button {
    min-height: 44px;
    padding: 8px 10px;
  }
  .tag { margin: 12px 0 4px; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--orange); }
  .line {
    width: 100%;
    min-height: 48px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    background: transparent;
    border: 0;
    border-bottom: 1px solid rgba(255,255,255,.18);
    text-align: left;
  }
  .line.on, .line.rhyme {
    background: rgba(208, 48, 131, .2);
    box-shadow: inset 3px 0 0 var(--pink), 0 0 14px rgba(208, 48, 131, .4);
  }
  .led {
    width: 54px;
    height: 10px;
    flex: 0 0 54px;
    background: repeating-linear-gradient(90deg, #222 0 5px, #000 5px 7px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
    position: relative;
  }
  .led i {
    position: absolute;
    inset: 0 auto 0 0;
    width: calc(var(--n) * 12.5%);
    background: repeating-linear-gradient(90deg, var(--green) 0 5px, transparent 5px 7px);
    box-shadow: 0 0 8px var(--green);
  }
  .syl { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--green); width: 1.6em; }
  .punch { margin-top: 12px; border-top: 1px solid var(--pink); padding-top: 8px; }
  .punch button { width: 100%; text-align: left; margin-top: 6px; }
  .phone { display: none; gap: 8px; margin-bottom: 10px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .report {
    display: grid;
    gap: 14px;
    border: 1px solid var(--gold);
    padding: 16px;
    box-shadow: 0 0 18px rgba(243, 203, 71, .25);
  }
  .report p { margin: 0; line-height: 1.45; }
  .report strong {
    display: block;
    margin-bottom: 4px;
    color: var(--gold);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-size: 12px;
  }
  .drawer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 5;
    background: #050505;
    border-top: 2px solid var(--pink);
    box-shadow: 0 -12px 40px rgba(208, 48, 131, .35);
    padding: 16px;
    display: none;
  }
  .drawer.show { display: block; }
  .drawer button { display: block; width: 100%; margin-top: 8px; }
  .toast { min-height: 24px; color: var(--green); font-size: 13px; }
  @media (min-width: 900px) {
    .console {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 260px;
    }
    .rack, .sheet, .booth { display: block; position: static; order: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bezel::after { background: none; }
    .tokens .seg i, .knob, .dial, .sound, .door { animation: none; }
  }
  @media (max-width: 800px) {
    h1 { font-size: 32px; }
    header.top { grid-template-columns: 1fr auto; }
    .marquee-name { grid-column: 1 / -1; text-align: left; letter-spacing: .2em; }
    .console { display: flex; flex-direction: column; }
    .rack { order: 0; }
    .sheet { order: 1; }
    .booth { order: 2; }
    .dial { width: 148px; height: 148px; margin: 8px auto 12px; }
    .dial button { transform: rotate(calc(var(--i) * 60deg)) translateY(-88px) rotate(calc(var(--i) * -60deg)); }
  }
  @media (hover: hover) {
    .door:hover, .line:hover { border-color: var(--gold); }
  }
  @media print {
    .rack, .booth, .phone, .tabs, header.top, .drawer { display: none !important; }
    .bezel { box-shadow: none; }
    body { background: #fff; color: #000; }
  }
</style>
</head>

      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = name;
      b.style.setProperty('--i', i);
      b.className = name === state.genre ? 'on' : '';
      b.addEventListener('click', function () {
        state.genre = name;
        paintDial();
      });
      dial.insertBefore(b, knob);
    });
    knob.style.setProperty('--turn', (genres.indexOf(state.genre) * 60) + 'deg');
  }
  function paintPills() {
    Object.keys(groups).forEach(function (key) {
      var host = document.querySelector('[data-group="' + key + '"]');
      host.textContent = '';
      groups[key].forEach(function (name) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = name;
        if (state[key] === name) b.className = 'on';
        b.addEventListener('click', function () {
          state[key] = name;
          paintPills();
          paintBooth();
        });
        host.appendChild(b);
      });
    });
  }
  function paintSheet() {
    var host = $('sheet');
    host.textContent = '';
    var current = flat()[state.line];
    song.forEach(function (sec) {
      var tag = document.createElement('p');
      tag.className = 'tag';
      tag.textContent = '[' + sec.tag + ']';
      host.appendChild(tag);
      sec.lines.forEach(function (line) {
        var idx = flat().indexOf(line);
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'line' + (idx === state.line || (current && line.rhyme === current.rhyme) ? ' rhyme' : '') + (idx === state.line ? ' on' : '');
        var n = Math.max(1, Math.min(8, line.syl));
        b.innerHTML = '<span class="led" style="--n:' + n + '"><i></i></span><span class="syl">' + line.syl + '</span><span></span>';
        b.querySelector('span:last-child').textContent = line.text;
        b.addEventListener('click', function () {
          state.line = idx;
          paintSheet();
        });
        host.appendChild(b);
        if (idx === state.line) host.appendChild(punchBox(line));
      });
    });
    paintBooth();
  }
  function optionsFor(line) {
    return punches[line.text] || [
      line.text.replace(/the /i, 'our '),
      line.text.replace(/I /i, 'We '),
      'Hold the last word, then turn it.'
    ];
  }
  function punchBox(line) {
    var box = document.createElement('div');
    box.className = 'punch';
    box.id = 'punch';
    var k = document.createElement('p');
    k.className = 'kicker';
    k.textContent = 'Punch in';
    box.appendChild(k);
    optionsFor(line).forEach(function (text) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = text;
      b.addEventListener('click', function () { line.text = text; paintSheet(); });
      box.appendChild(b);
    });
    return box;
  }
  function paintBooth() {
    var host = $('focus');
    host.textContent = '';
    ['hook', 'verse'].forEach(function (id) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = id === 'hook' ? 'Hook' : 'Verse';
      if (state.focus === id) b.className = 'on';
      b.addEventListener('click', function () { state.focus = id; paintBooth(); });
      host.appendChild(b);
    });
    $('note-label').textContent = (state.focus === 'hook' ? 'Hook' : 'Verse') + ' notes';
    var place = state.region === 'Bay' ? 'the block' : (state.region === 'UK' ? 'the high street' : 'the kitchen');
    $('notes').textContent = notes[state.focus] + ' Language: ' + state.language + '. Keep the picture in ' + place + '.';
  }
  function paintResults() {
    var tabs = $('result-tabs');
    tabs.textContent = '';
    ['Lyrics', 'Sound', 'Save & release'].forEach(function (name) {
      var id = name === 'Lyrics' ? 'lyrics' : (name === 'Sound' ? 'sound' : 'save');
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = name;
      if (state.tab === id) b.className = 'on';
      b.addEventListener('click', function () { state.tab = id; paintResults(); });
      tabs.appendChild(b);
    });
    var body = $('result-body');
    body.textContent = '';
    if (state.tab === 'sound') {
      var pre = document.createElement('pre');
      pre.textContent = state.genre + ', era ' + state.era + ', region ' + state.region + ', language ' + state.language + '.';
      body.appendChild(pre);
    } else if (state.tab === 'save') {
      var p = document.createElement('p');
      p.textContent = 'Label: AI-assisted. Save keeps this draft. Release opens the form.';
      var save = document.createElement('button');
      save.type = 'button';
      save.textContent = 'Save to my account';
      save.addEventListener('click', function () { $('toast').textContent = 'Saved in this mockup. No account call.'; $('drawer').classList.add('show'); });
      body.appendChild(p);
      body.appendChild(save);
    } else {
      var report = document.createElement('div');
      report.className = 'report';
      [
        ['Rhyme', 'night and light lock. on and gone lock. room and soon sit near each other, not a lock.'],
        ['Syllables', 'Verse runs 10, then 9. Hook runs 7, then 6. Bridge runs 7, then 9.'],
        ['Cliche', 'light returns in the verse and the hook. Leave it on the hook. Let the verse name the plates.']
      ].forEach(function (pair) {
        var p = document.createElement('p');
        var s = document.createElement('strong');
        s.textContent = pair[0];
        p.appendChild(s);
        p.appendChild(document.createTextNode(pair[1]));
        report.appendChild(p);
      });
      body.appendChild(report);
    }
  }
  function toast(text) {
    var el = $('toast');
    el.textContent = text;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text.indexOf('Copied') === 0 ? el.dataset.copy || '' : '').catch(function () {});
    }
  }
  document.querySelectorAll('[data-door]').forEach(function (b) {
    b.addEventListener('click', function () { show('console'); });
  });
  $('open-results').addEventListener('click', function () { show('results'); });
  $('back-doors').addEventListener('click', function () { show('doors'); });
  $('results-back').addEventListener('click', function () { show('console'); });
  function openExport() { $('drawer').classList.add('show'); }
  $('open-export').addEventListener('click', openExport);
  $('results-export').addEventListener('click', openExport);
  $('close-drawer').addEventListener('click', function () { $('drawer').classList.remove('show'); });
  $('copy-suno').addEventListener('click', function () {
    var text = tagged() + '\n\n' + state.genre + ', ' + state.era + ', ' + state.region + ', ' + state.language;
    $('toast').dataset.copy = text;
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    $('toast').textContent = 'Copied for Suno, tags included.';
  });
  $('copy-clean').addEventListener('click', function () {
    var text = clean();
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    $('toast').textContent = 'Copied clean lyrics.';
  });
  $('copy-pdf').addEventListener('click', function () { window.print(); });
  $('save-plai').addEventListener('click', function () {
    $('toast').textContent = 'Saved to PLAIGROUND in this mockup. No account call.';
  });

  function paintSounds() {
    var host = $('sounds');
    host.textContent = '';
    sounds.forEach(function (sound) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'sound';
      var wrap = document.createElement('span');
      var title = document.createElement('b');
      title.textContent = sound.genre + ' · ' + sound.era;
      var topic = document.createElement('span');
      topic.textContent = sound.topic;
      wrap.appendChild(title);
      wrap.appendChild(topic);
      b.appendChild(wrap);
      b.addEventListener('click', function () {
        state.genre = sound.genre;
        state.era = sound.era;
        state.topic = sound.topic;
        $('song-topic').textContent = 'Topic · ' + sound.topic;
        $('song-title').textContent = sound.topic === 'Kitchen' ? 'Kitchen light' : sound.topic;
        paintDial();
        paintPills();
        show('console');
      });
      host.appendChild(b);
    });
  }
  function fromHash() {
    var hash = (location.hash || '').replace('#', '');
    if (hash === 'console' || hash === 'punch') {
      show('console');
      if (hash === 'punch') { state.line = 1; paintSheet(); }
    } else if (hash === 'results') show('results');
    else if (hash === 'export') { show('console'); openExport(); }
    else show('doors');
  }
  paintSounds();
  paintDial();
  paintPills();
  paintBooth();
  paintSheet();
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
</body>
</html>
