<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAIGROUND – Release Your Music</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0d0618;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Background light streaks */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -20%;
      width: 140%;
      height: 200%;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(168, 85, 247, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(234, 179, 8, 0.15) 0%, transparent 45%),
        radial-gradient(ellipse at 60% 80%, rgba(147, 51, 234, 0.2) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 80px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .logo-icon {
      font-size: 26px;
      color: #fbbf24;
    }

    .login-btn {
      background: #fbbf24;
      color: #1a0b2e;
      border: none;
      padding: 10px 22px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .login-btn:hover {
      background: #f59e0b;
      transform: translateY(-1px);
    }

    /* Hero */
    .hero {
      text-align: center;
      max-width: 780px;
      margin: 0 auto 70px;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    .hero p {
      font-size: 1.15rem;
      color: #c4b5fd;
      line-height: 1.6;
      margin-bottom: 40px;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }

    .cta-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: #d946ef;
      color: white;
      border: none;
      padding: 16px 36px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(217, 70, 239, 0.4);
    }

    .btn-primary:hover {
      background: #c026d3;
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(217, 70, 239, 0.5);
    }

    .btn-secondary {
      background: transparent;
      color: #fbbf24;
      border: 2px solid #fbbf24;
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(251, 191, 36, 0.1);
      transform: translateY(-2px);
    }

    /* Process steps */
    .process {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 80px;
      font-size: 14px;
      color: #a78bfa;
      letter-spacing: 0.5px;
    }

    .process span {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .process .step-num {
      color: #c4b5fd;
      font-weight: 600;
    }

    .process .active {
      color: #d946ef;
      font-weight: 700;
    }

    /* Footer note */
    .footer-note {
      text-align: center;
      margin-top: 60px;
      font-size: 13px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 2.2rem;
      }
      .cta-buttons {
        flex-direction: column;
        align-items: center;
      }
      .btn-primary, .btn-secondary {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span class="logo-icon">♪</span>
        PLAIGROUND
      </div>
      <button class="login-btn">LOGIN</button>
    </header>

    <section class="hero">
      <h1>Upload. Release.<br>Get paid.</h1>
      <p>The publishing & distribution home for AI-assisted creators. Turn your songs into real streams and real revenue — fast.</p>
      
      <div class="cta-buttons">
        <button class="btn-primary">Release Now</button>
        <button class="btn-secondary">Release + Market</button>
      </div>
    </section>

    <div class="process">
      <span><span class="step-num">01</span> Upload</span>
      <span>→</span>
      <span><span class="step-num">02</span> Split</span>
      <span>→</span>
      <span class="active"><span class="step-num">03</span> Release</span>
      <span>→</span>
      <span><span class="step-num">04</span> Get paid</span>
    </div>

    <div class="footer-note">
      PLAIGROUND · AI-assisted music publishing & distribution
    </div>
  </div>
</body>
</html>
