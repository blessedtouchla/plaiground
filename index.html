<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAIGROUND</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0514;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Rich purple + gold light streaks */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 15% 20%, rgba(147, 51, 234, 0.35) 0%, transparent 60%),
        radial-gradient(ellipse 70% 40% at 85% 15%, rgba(234, 179, 8, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 70% 85%, rgba(168, 85, 247, 0.25) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 24px 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 100px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .logo span {
      color: #fbbf24;
      font-size: 24px;
    }

    .login {
      background: #fbbf24;
      color: #1a0b2e;
      border: none;
      padding: 11px 24px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 14px;
    }

    .hero {
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(2.6rem, 8vw, 3.8rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 22px;
      letter-spacing: -1px;
    }

    .hero p {
      font-size: 1.15rem;
      color: #c4b5fd;
      line-height: 1.55;
      max-width: 480px;
      margin: 0 auto 48px;
    }

    .buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-release {
      background: #d946ef;
      color: white;
      border: none;
      padding: 17px 40px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 8px 30px rgba(217, 70, 239, 0.45);
    }

    .btn-market {
      background: transparent;
      color: #fbbf24;
      border: 2px solid #fbbf24;
      padding: 15px 36px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
    }

    .process {
      margin-top: 90px;
      text-align: center;
      font-size: 14px;
      color: #a78bfa;
      letter-spacing: 0.4px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .process .active {
      color: #d946ef;
      font-weight: 700;
    }

    @media (max-width: 520px) {
      .buttons {
        flex-direction: column;
        align-items: center;
      }
      .btn-release, .btn-market {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span>♪</span> PLAIGROUND
      </div>
      <button class="login">LOGIN</button>
    </header>

    <section class="hero">
      <h1>Upload. Release.<br>Get paid.</h1>
      <p>The publishing & distribution home for AI-assisted creators. Turn your songs into real streams and real revenue — fast.</p>
      
      <div class="buttons">
        <button class="btn-release">Release Now</button>
        <button class="btn-market">Release + Market</button>
      </div>
    </section>

    <div class="process">
      <span>01 Upload</span>
      <span>→</span>
      <span>02 Split</span>
      <span>→</span>
      <span class="active">03 Release</span>
      <span>→</span>
      <span>04 Get paid</span>
    </div>
  </div>
</body>
</html>
