<!--
  Quick recap player for a blog post.
  Copy the section below and place it just under the H1 byline, before the body.
  Save the clip as assets/blog/SLUG/recap.mp4 (H.264, faststart, keep the audio, stay under about 6 MB)
  and a poster as assets/blog/SLUG/recap.jpg from an early frame.
  Styles live on .blog-recap in site.css. Bump that page's site.css query so the rules load.
  The 420px cap is for a vertical frame. width and height stay the real pixel size so iPhone Safari
  can size the poster before the file loads. playsinline keeps playback in the page.
  If the post already has JSON-LD, add a VideoObject script. See blog-cd-era-vs-streaming-pay.html.
  YouTube is optional. Keep the paragraph below and replace YOUTUBE_URL, or delete that paragraph.
-->
<section class="blog-recap-band" aria-label="Watch the quick recap">
  <div class="wrap">
    <div class="blog-recap-slot">
      <figure class="blog-recap">
        <p class="eyebrow">Watch the quick recap</p>
        <video src="/assets/blog/SLUG/recap.mp4" controls playsinline webkit-playsinline preload="metadata" poster="/assets/blog/SLUG/recap.jpg" width="WIDTH" height="HEIGHT"></video>
        <!-- Optional. Delete this paragraph when the post has no YouTube URL. -->
        <p class="blog-recap-yt"><a href="YOUTUBE_URL" target="_blank" rel="noopener">Watch on YouTube</a></p>
      </figure>
    </div>
  </div>
</section>
