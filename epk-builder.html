<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>EPK Builder Tester | PLAIGROUND</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{--bk:#07040d;--pu:#7D3CFF;--mg:#FF3C8E;--gd:#F3CB47;--tx:#f4eefc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#24104a,var(--bk) 60%);color:var(--tx);font-family:Inter,sans-serif;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:1px}.logo b{color:var(--mg)}
.hud{display:flex;gap:10px}.pill{background:#160b2b;border:2px solid var(--pu);border-radius:99px;padding:6px 12px;font-weight:800}
.pill.gold{border-color:var(--gd);color:var(--gd)}
.meter{height:14px;background:#160b2b;border-radius:99px;margin:12px 0;overflow:hidden;border:1px solid #3a2466}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pu),var(--mg),var(--gd));transition:width .4s}
.card{background:#120a22;border:2px solid #2e1a55;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 0 30px #7d3cff22}
h1,h2,h3{font-family:'Space Grotesk';margin:.2em 0}h1{font-size:28px}h2{color:var(--gd)}
.lvl{color:var(--mg);font-weight:900;letter-spacing:2px;font-size:12px;text-transform:uppercase}
.q{margin:16px 0}.q>label{font-weight:800;display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#1d1036;color:var(--tx);border:2px solid #3a2466;border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--gd);color:#000;border-color:var(--gd);box-shadow:0 0 0 2px #000,0 0 14px var(--gd)}.chip[aria-pressed=true]::before{content:'\2713  '}
input[type=text],input[type=url],textarea{width:100%;background:#0b0616;color:var(--tx);border:2px solid #3a2466;border-radius:12px;padding:10px;font:inherit;margin-top:6px}
textarea{min-height:70px}
.btn{background:linear-gradient(90deg,var(--mg),var(--pu));color:#fff;border:0;border-radius:14px;padding:13px 22px;font-weight:900;font-size:16px;cursor:pointer;margin:6px 6px 0 0}
.btn.alt{background:#1d1036;border:2px solid var(--gd);color:var(--gd)}.btn:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:13px;color:#c9b8ef}.warn{color:var(--gd);font-weight:700}.bad{color:var(--mg);font-weight:700}
.stat{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:8px;margin:6px 0}input[type=range]{width:100%;accent-color:var(--mg)}
.toast{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(0);background:var(--gd);color:#000;font:900 30px 'Space Grotesk';padding:20px 34px;border-radius:20px;transition:transform .3s;z-index:9;text-align:center}.toast.on{transform:translate(-50%,-50%) scale(1)}
.fact{display:flex;gap:8px;align-items:flex-start;margin:8px 0;background:#0b0616;padding:10px;border-radius:10px}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.skin{padding:14px;border-radius:14px;cursor:pointer;border:3px solid transparent;font-weight:800;text-align:center}
.skin{text-shadow:0 1px 2px rgba(0,0,0,.6);color:#fff;font-size:16px}.skin[aria-pressed=true]{border-color:var(--gd);box-shadow:0 0 0 3px #000,0 0 16px var(--gd)}.skin[aria-pressed=true]::after{content:' \2713'}
.s-neon{background:linear-gradient(135deg,#7D3CFF,#FF3C8E)}.s-gold{background:linear-gradient(135deg,#000,#3d2f00);color:var(--gd)}.s-comic{background:#fff;color:#000;text-shadow:none;border-color:#000}
.qc li{margin:4px 0}.ok{color:#7dff9a}
.epk{border-radius:18px;padding:24px;margin-top:12px}.epk.neon{background:linear-gradient(160deg,#2a0f5c,#5c0f3a);}.epk.gold{background:#050505;border:2px solid var(--gd)}.epk.gold h2,.epk.gold h3{color:var(--gd)}.epk.comic{background:#fffaf0;color:#111}.epk.comic h2{color:#7D3CFF}
.avatar{width:170px;height:210px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:12px;font-weight:700;background:radial-gradient(circle,var(--mg),var(--pu) 70%);color:#fff;float:right;margin:0 0 10px 14px;border:3px solid var(--gd)}
.avatar .face{font-size:54px}
.badge{display:inline-block;background:var(--gd);color:#000;font-weight:900;border-radius:8px;padding:4px 10px;font-size:13px;margin:4px 0}
.panels{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.panels div{border:2px solid currentColor;border-radius:10px;padding:10px;font-size:14px;min-height:70px}
.tcard{width:260px;border-radius:16px;padding:14px;background:linear-gradient(160deg,var(--pu),var(--mg));border:4px solid var(--gd);color:#fff}
.tcard .row{display:flex;justify-content:space-between;font-size:13px;font-weight:800}
.hidden{display:none}

.epk{--bg:#2a0f5c;--ink:#fff;--ac:#F5C542;--ac2:#FF3C8E;background:var(--bg);color:var(--ink);font-family:inherit}
.epk h2,.epk h3{color:var(--ac)}.epk .badge{background:var(--ac);color:var(--bg)}
.epk.t-space{--bg:#05040f;--ink:#e6e8ff;--ac:#2FE6FF;--ac2:#b37dff;background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#cfe,transparent),radial-gradient(900px 400px at 80% -10%,rgba(125,60,255,.45),transparent),var(--bg);font-family:'Trebuchet MS',system-ui,sans-serif;letter-spacing:.02em}
.epk.t-space h2{text-transform:uppercase;letter-spacing:.18em;text-shadow:0 0 18px var(--ac)}
.epk.t-arcade{--bg:#fff3fb;--ink:#1a1033;--ac:#FF3C8E;--ac2:#7D3CFF;background:repeating-linear-gradient(45deg,#fff3fb 0 22px,#ffe6f5 22px 44px);border:4px solid #1a1033;box-shadow:8px 8px 0 #7D3CFF}
.epk.t-arcade h2{font-size:34px;color:#7D3CFF;text-shadow:3px 3px 0 #F5C542}
.epk.t-press{--bg:#ffffff;--ink:#111;--ac:#111;--ac2:#888;font-family:Georgia,'Times New Roman',serif;border:1px solid #ddd}
.epk.t-press h2{font-size:30px;font-weight:400;border-bottom:1px solid #111;padding-bottom:6px}.epk.t-press .lchip{background:#fff;color:#111;border-color:#111}
.epk.t-street{--bg:#0b0b0f;--ink:#fff;--ac:#F5C542;--ac2:#FF3C8E;background:linear-gradient(180deg,#141018,#0b0b0f);font-family:Impact,'Arial Black',sans-serif}
.epk.t-street h2{font-size:40px;text-transform:uppercase}.epk.t-street p{font-family:system-ui,sans-serif}
.epk.t-velvet{--bg:#1a0b14;--ink:#fbeee6;--ac:#d98a6a;--ac2:#7D3CFF;background:linear-gradient(160deg,#2a0f22,#1a0b14);font-family:Georgia,serif}
.epk.t-comic{--bg:#fffaf0;--ink:#111;--ac:#7D3CFF;--ac2:#FF3C8E;border:3px solid #111}
.epk.t-gold{--bg:#050505;--ink:#fff;--ac:#F5C542;--ac2:#F5C542;border:2px solid var(--ac)}
.lchips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0}.lchip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;border:2px solid var(--ac,#F5C542);background:color-mix(in srgb,var(--ac,#F5C542) 18%,transparent);color:inherit;text-decoration:none;font-weight:700;font-size:14px}
.lchip b{font-size:11px;opacity:.75;text-transform:uppercase}
.esec{position:relative;border-radius:10px}.editing .esec{outline:2px dashed var(--ac);outline-offset:4px;margin:14px 0;padding-top:30px}
.etools{display:none;position:absolute;top:2px;right:2px;gap:4px}.editing .etools{display:flex}.etools button,.etools label{background:#000;color:#F5C542;border:1px solid #F5C542;border-radius:6px;font-size:12px;padding:3px 7px;cursor:pointer}
.esec.off{opacity:.35}.esec.off .ebody{display:none}.editing [contenteditable=true]{background:rgba(245,197,66,.08);outline:1px solid rgba(245,197,66,.4)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.tcardpick{border-radius:14px;padding:14px;min-height:90px;cursor:pointer;border:3px solid #3a2466;font-weight:800;text-align:left}.tcardpick small{display:block;font-weight:400;font-size:12px;margin-top:4px}
.tcardpick[aria-pressed=true]{border-color:var(--gd);box-shadow:0 0 0 3px #000,0 0 16px var(--gd)}.rec{color:#000;background:var(--gd);border-radius:99px;padding:2px 8px;font-size:11px;margin-left:6px}
.cpick{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.cpick label{display:flex;gap:6px;align-items:center;font-size:14px}
@media print{.etools{display:none!important}.esec.off{display:none}}
@media print{body{background:#fff}.noprint,header,.meter{display:none!important}.card{border:0;box-shadow:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="noprint"><div class="logo">PLAI<b>GROUND</b> EPK ARCADE</div>
<div class="hud"><span class="pill gold" id="coins" aria-label="Coins">Coins: 0</span><span class="pill" id="credits" aria-label="Credits">Credits: 500</span></div></header>
<div class="meter noprint" aria-label="Progress"><i id="bar"></i></div>
<p class="note noprint">Tester build. Unlisted. Nothing here goes public until you share it.</p>
<main id="app"></main>
</div>
<div class="toast" id="toast"></div>
<script src="/lib/genre-presence.js"></script>
<script>
(function(){
var S={label:'',name:'',photoOk:false,photo:'',picks:{},own:{},stats:{Swagger:5,Heart:5,Chaos:5,Grind:5,Mystery:5},cyborg:30,links:'',tracks:'',extra:'',facts:[],epk:null,source:'',skin:'',colors:{},order:null,hidden:{},edit:{},editMode:false,coins:0,credits:500,step:0};
var app=document.getElementById('app');
var LABELS={'Human artist':'A real person makes and performs the music.','AI assisted':'A real artist, with an AI-styled avatar from your photo.','Full AI persona':'A fully AI-generated artist persona. No photo.'};
var Q=[
 {lvl:'Level 1: Basics',items:[
  ['era','Era / age',['Born in the 80s','Born in the 90s','Born in the 2000s','Born in the 2010s','Ageless']],
  ['gender','Gender',['She','He','They','Beyond']],
  ['hair','Hair',['Neon','Flames','Stardust','Braids','Buzz cut','Long and wavy','Chrome']],
  ['look','Look',['Streetwear','Gown','Armor','Thrift','Futuristic','Cowboy','Gothic']]]},
 {lvl:'Level 2: Hybrid Mode',hybrid:true,items:[
  ['planet','Alien home planet',['Bass Planet','Soul Moon','Trap Nebula','Pop Galaxy','Rock Asteroid','Earth only']]]},
 {lvl:'Level 3: Voice and Sound',items:[
  ['voice','Voice texture',['Raspy','Airy','Deep','Silky','Gritty','Soulful','Smoky','Falsetto','Robotic']],
  ['genre','Genre',['Pop','Hip hop','R&B','Rock','Country','EDM','Latin','Gospel','Synth pop']],
  ['vibe','Vibe',['Dreamy','Hype','Dark','Heartfelt','Funny','Rebel','Chill']]]},
 {lvl:'Level 4: Lifestyle and Backstory',items:[
  ['hobbies','Hobbies',['Skating','Gaming','Cooking','Fashion','Anime','Dance','Cars'],1],
  ['fears','Fears (your villain)',['Failure','Being forgotten','Silence','Heights','The dark','Selling out']],
  ['dreams','Dreams (your quest)',['Headline a festival','Buy mom a house','Start a label','Tour the world','Inspire kids']],
  ['hometown','Hometown vibe',['Big city block','Beach town','Small farm town','Desert','Outer space']],
  ['item','Signature item',['Gold chain','Guitar','Headphones','Shades','Mic','Skateboard']]]},
 {lvl:'Level 5: Powers',stats:true,items:[
  ['superpower','Superpower',['Hypnotize crowds','Heal hearts','Break the internet','Time travel','Read minds']]]}
];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1100)}
function coin(n){S.coins+=n;hud()}
function hud(){document.getElementById('coins').textContent='Coins: '+S.coins;document.getElementById('credits').textContent='Credits: '+S.credits;document.getElementById('bar').style.width=Math.round(S.step/STEPS.length*100)+'%'}
function isHybrid(){return S.label!=='Human artist'}
function val(k){var p=(S.picks[k]||[]).slice();if(S.own[k])p.push(S.own[k]);return p.join(', ')}
function go(n,msg){S.dir=n<S.step?-1:1;S.step=n;if(msg)toast(msg);hud();STEPS[n]();window.scrollTo(0,0)}
function chips(k,opts,multi){return '<div class="chips" role="group" aria-label="'+esc(k)+'">'+opts.map(function(o){var on=(S.picks[k]||[]).indexOf(o)>-1;return '<button type="button" class="chip" data-k="'+k+'" data-v="'+esc(o)+'" data-multi="'+(multi?1:0)+'" aria-pressed="'+on+'">'+esc(o)+'</button>'}).join('')+'</div><input type="text" data-own="'+k+'" placeholder="Add your own" aria-label="Add your own '+esc(k)+'" value="'+esc(S.own[k]||'')+'">'}
app.addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;var k=c.dataset.k,v=c.dataset.v,a=S.picks[k]||[];if(c.dataset.multi==='1'){var i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v)}else a=a[0]===v?[]:[v];S.picks[k]=a;if(a.length)coin(5);c.parentNode.querySelectorAll('.chip').forEach(function(b){b.setAttribute('aria-pressed',a.indexOf(b.dataset.v)>-1)})});
app.addEventListener('input',function(e){var t=e.target;if(t.dataset.own)S.own[t.dataset.own]=t.value;if(t.dataset.stat){S.stats[t.dataset.stat]=+t.value;t.nextElementSibling.textContent=t.value}if(t.id==='cyborg'){S.cyborg=+t.value;document.getElementById('cyv').textContent=t.value+'%'}});

function stepMode(){
 app.innerHTML='<section class="card"><div class="lvl">Press Start</div><h1>Pick your artist identity</h1><p>Required. This label shows on your finished EPK and trading card. It is about who the artist is, and it is separate from the AI credits you add on each song.</p>'+
 '<div class="chips" role="radiogroup" aria-label="Artist identity">'+Object.keys(LABELS).map(function(l){return '<button type="button" class="chip mode" data-mode="'+l+'" aria-pressed="'+(S.label===l)+'">'+l+'</button>'}).join('')+'</div><p class="note" id="mdesc">'+(S.label?esc(LABELS[S.label]):'Pick one to continue.')+'</p>'+
 '<p class="note warn">Heads up: streaming platforms may badge AI personas. Picking the honest label now keeps your profile safe later.</p>'+
 '<div class="q"><label for="aname">Artist name</label><input type="text" id="aname" value="'+esc(S.name)+'" placeholder="Your artist name"></div>'+
 '<div id="photo" class="q '+(S.label==='AI assisted'?'':'hidden')+'"><label for="pfile">Your photo (AI assisted)</label><input type="file" id="pfile" accept="image/*" aria-label="Upload photo"><label><input type="checkbox" id="isme" '+(S.photoOk?'checked':'')+'> This is me</label><p class="note">Only upload a photo of yourself.</p></div>'+
 '<button class="btn" id="startBtn">Insert coin: Start</button><p class="bad" id="merr"></p></section>';
 app.querySelectorAll('.mode').forEach(function(b){b.onclick=function(){S.label=b.dataset.mode;stepMode()}});
 var f=document.getElementById('pfile');if(f)f.onchange=function(){var r=new FileReader();r.onload=function(){S.photo=r.result};if(f.files[0])r.readAsDataURL(f.files[0])};
 document.getElementById('isme').onchange=function(e){S.photoOk=e.target.checked};
 document.getElementById('startBtn').onclick=function(){S.name=document.getElementById('aname').value.trim();var m=document.getElementById('merr');
  if(!S.label){m.textContent='Pick an artist identity first.';return}if(!S.name){m.textContent='Add your artist name.';return}
  if(S.label==='AI assisted'&&S.photo&&!S.photoOk){m.textContent='Tick "This is me" to use your photo.';return}
  coin(10);go(1,'Level up!')};
}
function qStep(i){return function(){
 var sec=Q[i];if(sec.hybrid&&!isHybrid()){go(S.step+(S.dir<0?-1:1));return}
 var h='<section class="card"><div class="lvl">'+sec.lvl+'</div><h1>Build your character</h1>';
 if(sec.hybrid)h+='<div class="q"><label for="cyborg">Cyborg %</label><input type="range" id="cyborg" min="0" max="100" value="'+S.cyborg+'"> <b id="cyv">'+S.cyborg+'%</b></div>';
 sec.items.forEach(function(it){h+='<div class="q"><label>'+esc(it[1])+'</label>'+chips(it[0],it[2],it[3])+'</div>'});
 if(sec.stats)h+='<div class="q"><label>Stat bars</label>'+Object.keys(S.stats).map(function(k){return '<div class="stat"><span>'+k+'</span><input type="range" min="1" max="10" data-stat="'+k+'" aria-label="'+k+'" value="'+S.stats[k]+'"><b>'+S.stats[k]+'</b></div>'}).join('')+'</div>';
 h+='<button class="btn alt" id="back">Back</button><button class="btn" id="next">Next level</button></section>';
 app.innerHTML=h;document.getElementById('back').onclick=function(){go(S.step-1)};document.getElementById('next').onclick=function(){coin(20);go(S.step+1,'Level up! +20')};
}}
function stepLinks(){
 app.innerHTML='<section class="card"><div class="lvl">Level 6: Treasure Hunt</div><h1>Drop your own links</h1><p class="note">We only use what you paste here. No scraping.</p>'+
 '<div class="q"><label for="links">Links and handles (one per line)</label><textarea id="links" placeholder="https://instagram.com/you&#10;@yourtiktok">'+esc(S.links)+'</textarea></div>'+
 '<div class="q"><label for="tracks">Tracks (title or link, one per line)</label><textarea id="tracks">'+esc(S.tracks)+'</textarea></div>'+
 '<div class="q"><label for="extra">Add your own (press, bio notes, anything)</label><textarea id="extra">'+esc(S.extra)+'</textarea></div>'+
 '<button class="btn alt" id="back">Back</button><button class="btn" id="next">Write my bio (100 credits)</button><p id="st" class="note"></p></section>';
 document.getElementById('back').onclick=function(){go(S.step-1)};
 document.getElementById('next').onclick=function(){S.links=val2('links');S.tracks=val2('tracks');S.extra=val2('extra');write(this)};
}
function val2(id){return document.getElementById(id).value.trim()}
function payload(){var p={mode:S.label,name:S.name,cyborg:isHybrid()?S.cyborg+'%':'',links:S.links,tracks:S.tracks,extra:S.extra,stats:S.stats};Q.forEach(function(s){s.items.forEach(function(it){p[it[0]]=val(it[0])})});if(!isHybrid()){p.planet='';}return p}
function write(btn){btn.disabled=true;var st=document.getElementById('st');st.textContent='The writer is cooking...';S.credits-=100;hud();
 fetch('/api/song-helper?action=epk-write',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())}).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})}).then(function(res){
  if(!res.ok||!res.d.ok){S.credits+=100;hud();btn.disabled=false;st.innerHTML='<span class="bad">'+esc((res.d&&res.d.error)||'That did not work.')+'</span> Credits refunded automatically.';return}
  if(res.d.refund){S.credits+=100;hud();toast('Credits refunded')}
  S.epk=res.d.epk;S.facts=res.d.facts;S.source=res.d.source;S.notice=res.d.notice;coin(30);go(S.step+1,'Check your facts')
 }).catch(function(){S.credits+=100;hud();btn.disabled=false;st.innerHTML='<span class="bad">Network hiccup.</span> Credits refunded automatically.'})}
function stepBio(){var e=S.epk;
 var h='<section class="card"><div class="lvl">Level 7: Bio Builder</div><h1>Check your facts</h1>'+(S.notice?'<p class="warn">'+esc(S.notice)+'</p>':'<p class="note">Written by AI from your answers only.</p>')+
 '<p>Confirm every fact. Each one is yours, so tick it only if it is true.</p>'+S.facts.map(function(f,i){return '<label class="fact"><input type="checkbox" class="fc" aria-label="Confirm fact '+(i+1)+'"> <span>'+esc(f)+'</span></label>'}).join('')+
 '<h3>One-liner</h3><textarea id="e_oneLiner">'+esc(e.oneLiner)+'</textarea><h3>Short bio</h3><textarea id="e_shortBio">'+esc(e.shortBio)+'</textarea><h3>Long bio</h3><textarea id="e_longBio" style="min-height:140px">'+esc(e.longBio)+'</textarea><h3>For fans of</h3><textarea id="e_forFansOf">'+esc(e.forFansOf)+'</textarea>'+
 '<h3>Origin story (4 panels)</h3>'+e.panels.map(function(p,i){return '<textarea id="e_p'+i+'">'+esc(p)+'</textarea>'}).join('')+
 '<button class="btn alt" id="back">Back</button><button class="btn" id="next" disabled>All facts confirmed</button></section>';
 app.innerHTML=h;var n=document.getElementById('next');
 function chk(){n.disabled=[].some.call(app.querySelectorAll('.fc'),function(c){return !c.checked})}chk();
 app.querySelectorAll('.fc').forEach(function(c){c.onchange=function(){if(c.checked)coin(2);chk()}});
 document.getElementById('back').onclick=function(){go(S.step-1)};
 n.onclick=function(){['oneLiner','shortBio','longBio','forFansOf'].forEach(function(k){e[k]=val2('e_'+k)});e.panels=e.panels.map(function(_,i){return val2('e_p'+i)});coin(20);go(S.step+1,'Dress up time!')};
}
var THEMES=[['space','Deep Space Saga','Dark sci-fi, starfield, glowing type'],['arcade','Bright Arcade','Loud color, cartoon pop, bold shadows'],['press','Minimal Press','White, serif, clean for bookers and press'],['street','Street Poster','Black, gold, heavy poster type'],['velvet','Velvet Night','Warm dark tones, soft and intimate'],['comic','Comic Book','Paper white, ink lines, panels'],['gold','Gold Cabinet','Black and gold, classic cabinet']];
var SECS={hero:'Avatar and name',oneLiner:'One-liner',bio:'Bio',story:'Origin story',tracks:'Tracks',links:'Links',forFansOf:'For fans of',platforms:'Where to post first',hashtags:'Hashtags'};
function preset(){return window.GenrePresence?GenrePresence.forGenre(val('genre')):null}

 app.innerHTML='<section class="card"><div class="lvl">Level 8: Dress Up</div><h1>Pick your theme</h1>'+

 '<div class="tgrid" role="group" aria-label="Themes">'+THEMES.map(function(t){return '<button type="button" class="tcardpick epk t-'+t[0]+'" data-skin="'+t[0]+'" aria-pressed="'+(S.skin===t[0])+'">'+t[1]+(p&&p.theme===t[0]?'<span class="rec">Best for '+esc(p.genre)+'</span>':'')+'<small>'+t[2]+'</small></button>'}).join('')+'</div>'+

 '<p class="note">You can edit every section, reorder, hide and swap images on the last level.</p>'+
 '<button class="btn alt" id="back">Back</button><button class="btn" id="next">Boss level</button></section>';
 app.querySelectorAll('.tcardpick').forEach(function(b){b.onclick=function(){S.skin=b.dataset.skin;coin(5);stepSkin()}});

function platformOf(u){var l=u.toLowerCase();var m=[['tiktok','TikTok'],['instagram','Instagram'],['youtu','YouTube'],['spotify','Spotify'],['apple','Apple Music'],['soundcloud','SoundCloud'],['bandcamp','Bandcamp'],['x.com','X'],['twitter','X'],['facebook','Facebook'],['discord','Discord'],['wannaplai','PLAIGROUND']];for(var i=0;i<m.length;i++)if(l.indexOf(m[i][0])>-1)return m[i][1];return u[0]==='@'?'Handle':'Link'}
function linkChips(){var a=S.links.split(/[\n,]+/).map(function(x){return x.trim()}).filter(Boolean);if(!a.length)return '';return '<ul class="lchips">'+a.map(function(u){var href=/^https?:\/\//i.test(u)?u:(/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u)?'https://'+u:'');return '<li>'+(href?'<a class="lchip" href="'+esc(href)+'" target="_blank" rel="noopener"><b>'+esc(platformOf(u))+'</b>'+esc(u.replace(/^https?:\/\/(www\.)?/i,''))+'</a>':'<span class="lchip"><b>'+esc(platformOf(u))+'</b>'+esc(u)+'</span>')+'</li>'}).join('')+'</ul>'}
function txt(key,def){return S.edit[key]!=null?S.edit[key]:def}
function ed(key,def,tag){return '<'+(tag||'p')+' data-edit="'+key+'"'+(S.editMode?' contenteditable="true"':'')+'>'+esc(txt(key,def))+'</'+(tag||'p')+'>'}
function secHtml(k){var e=S.epk,n=esc(S.name),p=preset();var body='';
 if(k==='hero')body=avatar()+ed('name',S.name,'h2')+'<span class="badge" id="idlabel">'+esc(S.label)+'</span><p class="note" style="color:inherit;opacity:.8">Artist identity label. Separate from per-song AI credits.'+(S.label!=='Human artist'?' Streaming platforms may badge AI personas.':'')+'</p>';
 else if(k==='oneLiner')body='<b>'+ed('oneLiner',e.oneLiner)+'</b>';
 else if(k==='bio')body=ed('shortBio',e.shortBio)+ed('longBio',e.longBio);
 else if(k==='story')body='<h3>Origin story</h3><div class="panels">'+e.panels.map(function(x,i){return ed('panel'+i,x,'div')}).join('')+'</div>';
 else if(k==='tracks'){var t=S.tracks.split(/\n+/).filter(Boolean);if(!t.length)return '';body='<h3>Tracks</h3><ul class="lchips">'+t.map(function(x){return '<li><span class="lchip">'+esc(x)+'</span></li>'}).join('')+'</ul>'}
 else if(k==='links'){var lc=linkChips();if(!lc)return '';body='<h3>Links</h3>'+lc}
 else if(k==='forFansOf')body='<i>'+ed('forFansOf',e.forFansOf)+'</i>';
 else if(k==='platforms'){if(!p)return '';body='<h3>Where to post first</h3><ul class="lchips">'+p.platforms.map(function(x,i){return '<li><span class="lchip"><b>'+(i+1)+'</b>'+esc(x)+'</span></li>'}).join('')+'</ul>'}
 else if(k==='hashtags'){if(!p)return '';body=ed('hashtags',p.hashtags.join(' '))}
 var tools='<div class="etools noprint"><button type="button" data-mv="-1" data-k="'+k+'" aria-label="Move '+SECS[k]+' up">Up</button><button type="button" data-mv="1" data-k="'+k+'" aria-label="Move '+SECS[k]+' down">Down</button><button type="button" data-hide="'+k+'">'+(S.hidden[k]?'Show':'Hide')+'</button>'+(k==='hero'?'<label>Swap image<input type="file" accept="image/*" data-img hidden></label>':'')+'</div>';
 return '<div class="esec'+(S.hidden[k]?' off':'')+'" data-sec="'+k+'">'+tools+'<div class="ebody">'+body+'</div></div>'}
function epkHtml(){if(!S.order)S.order=['hero','oneLiner','bio','story','tracks','links','forFansOf','platforms','hashtags'];Object.keys(SECS).forEach(function(k){if(S.order.indexOf(k)<0)S.order.push(k)});
 var st=Object.keys(S.colors).map(function(c){return '--'+c+':'+S.colors[c]}).join(';');
 return '<article class="epk t-'+(S.skin||'arcade')+(S.editMode?' editing':'')+'" id="epk" style="'+st+'">'+S.order.map(secHtml).join('')+'</article>'}
function wireEdit(){var ep=document.getElementById('epk');
 ep.querySelectorAll('[data-edit]').forEach(function(x){x.onblur=function(){S.edit[x.dataset.edit]=x.innerText.trim()}});
 ep.querySelectorAll('[data-mv]').forEach(function(b){b.onclick=function(){var i=S.order.indexOf(b.dataset.k),j=i+Number(b.dataset.mv);if(j<0||j>=S.order.length)return;var t=S.order[i];S.order[i]=S.order[j];S.order[j]=t;stepPrize()}});
 ep.querySelectorAll('[data-hide]').forEach(function(b){b.onclick=function(){var k=b.dataset.hide;S.hidden[k]=!S.hidden[k];stepPrize()}});
 var im=ep.querySelector('[data-img]');if(im)im.onchange=function(){var r=new FileReader();r.onload=function(){S.avImg=r.result;S.avBlend=false;stepPrize()};if(im.files[0])r.readAsDataURL(im.files[0])};
}
var CLAIM=/(#\s?1\b|number one|no\.? ?1\b|million(s)? (of )?(streams|plays|views|fans|followers)|billion|platinum|gold record|grammy|chart[- ]topping|top of the charts|viral hit|award[- ]winning|sold[- ]out)/i;
function qc(){var e=S.epk,r=[];
 function t(ok,msg){r.push([ok,msg])}
 t(!!S.label,'Artist identity label is set ('+(S.label||'missing')+')');
 ['oneLiner','shortBio','longBio','forFansOf'].forEach(function(k){t(!!(e[k]||'').trim(),k+' is filled in')});
 t(e.panels.every(function(p){return p.trim()}),'All 4 story panels are filled in');
 var all=[e.oneLiner,e.shortBio,e.longBio,e.forFansOf].concat(e.panels).join(' ');
 t(!CLAIM.test(all),'No unverifiable claims (like #1 or millions of streams)');
 t(!/[\u2014\u2013]/.test(all),'No long dashes');
 var bad=S.links.split(/\n+/).map(function(s){return s.trim()}).filter(Boolean).filter(function(l){return !(/^https?:\/\/[^\s.]+\.[^\s]+$/i.test(l)||/^@[\w.]{2,30}$/.test(l))});
 t(!bad.length,bad.length?'Fix these links: '+bad.join(', '):'Links and handles look valid');
 return r}
function stepQC(){var r=qc(),pass=r.every(function(x){return x[0]});
 app.innerHTML='<section class="card"><div class="lvl">Level 9: Boss Level QC</div><h1>'+(pass?'Boss defeated!':'The boss blocked you')+'</h1><ul class="qc">'+r.map(function(x){return '<li class="'+(x[0]?'ok':'bad')+'">'+(x[0]?'PASS':'FIX')+': '+esc(x[1])+'</li>'}).join('')+'</ul>'+
 '<p class="note">PLAIGROUND QC: a person also reviews flagged EPKs before anything goes public.</p><button class="btn alt" id="back">Back to fix</button><button class="btn" id="next" '+(pass?'':'disabled')+'>Looks good</button></section>';
 document.getElementById('back').onclick=function(){go(pass?S.step-1:7)};document.getElementById('next').onclick=function(){coin(50);go(S.step+1,'PRIZE TICKET!')};
}
function pick(k){return ((S.picks[k]||[]).concat(S.own[k]?[S.own[k]]:[]).join(' ')).toLowerCase()}
function avColor(t,map,d){for(var k in map){if(t.indexOf(k)>-1)return map[k]}return d}
function svgAvatar(){var hair=pick('hair'),look=pick('look'),item=pick('item'),vibe=pick('vibe'),g=pick('gender');var hy=isHybrid(),cy=hy?S.cyborg:0,alien=hy&&(pick('planet')||g.indexOf('beyond')>-1);
 var hc=avColor(hair,{neon:'#39FF14',pink:'#FF3C8E',purple:'#7D3CFF',blue:'#2FA8FF',blonde:'#F5C542',gold:'#F5C542',red:'#E0302A',white:'#eee',silver:'#ccc',flame:'#FF6A00',star:'#B9A7FF',black:'#111'},'#3a2466');
 var oc=avColor(look,{street:'#FF3C8E',gown:'#7D3CFF',armor:'#9aa4b5',thrift:'#c08a4a',futur:'#2FE6FF',gold:'#F5C542',black:'#151515'},'#7D3CFF');
 var skin=alien?'#8ef0c4':avColor(pick('skin')+look,{chrome:'#c9d1dc',glow:'#ffe9a8',crystal:'#bfe8ff'},'#c68a5e');
 var lean=/wild|bounc|chaos|hype/.test(vibe)?-8:(/chill|calm|dream/.test(vibe)?3:0);
 var longH=/long|flow|wave/.test(hair),spike=/spik|punk|mohawk|flame/.test(hair);
 var svg='<svg viewBox="0 0 180 320" role="img" aria-label="Full-body avatar" style="width:100%;max-width:220px;display:block;margin:0 auto"><defs><radialGradient id="aur"><stop offset="0" stop-color="#F5C542" stop-opacity=".55"/><stop offset="1" stop-color="#7D3CFF" stop-opacity="0"/></radialGradient></defs>'+
 '<ellipse cx="90" cy="150" rx="88" ry="150" fill="url(#aur)"/><ellipse cx="90" cy="308" rx="46" ry="7" fill="#000" opacity=".4"/>'+
 '<g transform="rotate('+lean+' 90 300)">'+
 '<rect x="68" y="210" width="18" height="92" rx="8" fill="'+(/gown/.test(look)?oc:'#1d1036')+'"/><rect x="94" y="210" width="18" height="92" rx="8" fill="'+(/gown/.test(look)?oc:'#1d1036')+'"/>'+
 (/gown/.test(look)?'<path d="M60 150 L120 150 L140 300 L40 300 Z" fill="'+oc+'"/>':'')+
 '<rect x="58" y="110" width="64" height="108" rx="20" fill="'+oc+'"/>'+
 (cy>0?'<rect x="58" y="'+(218-Math.round(108*cy/100))+'" width="'+Math.max(8,Math.round(64*Math.min(cy,60)/60))+'" height="'+Math.round(108*cy/100)+'" rx="10" fill="#9aa4b5" opacity=".9"/><circle cx="90" cy="150" r="9" fill="#2FE6FF"/>':'')+
 '<rect x="38" y="116" width="16" height="78" rx="8" fill="'+(cy>40?'#9aa4b5':skin)+'"/><rect x="126" y="116" width="16" height="78" rx="8" fill="'+(cy>20?'#9aa4b5':skin)+'"/>'+
 '<rect x="80" y="92" width="20" height="22" fill="'+skin+'"/><circle cx="90" cy="70" r="30" fill="'+skin+'"/>'+
 (alien?'<line x1="76" y1="42" x2="66" y2="22" stroke="'+skin+'" stroke-width="4"/><circle cx="66" cy="20" r="5" fill="#FF3C8E"/><line x1="104" y1="42" x2="114" y2="22" stroke="'+skin+'" stroke-width="4"/><circle cx="114" cy="20" r="5" fill="#FF3C8E"/>':'')+
 (spike?'<path d="M60 60 L66 26 L78 46 L90 18 L102 46 L114 26 L120 60 Z" fill="'+hc+'"/>':'<path d="M58 72 Q60 34 90 36 Q120 34 122 72 L118 60 Q90 46 62 60 Z" fill="'+hc+'"/>'+(longH?'<rect x="56" y="62" width="12" height="60" rx="6" fill="'+hc+'"/><rect x="112" y="62" width="12" height="60" rx="6" fill="'+hc+'"/>':''))+
 '<circle cx="80" cy="72" r="4" fill="'+(cy>50?'#2FE6FF':'#111')+'"/><circle cx="100" cy="72" r="4" fill="#111"/><path d="M80 86 Q90 93 100 86" stroke="#111" stroke-width="3" fill="none"/>'+
 (/headphone/.test(item)?'<path d="M60 70 Q90 30 120 70" stroke="#111" stroke-width="6" fill="none"/><rect x="54" y="64" width="10" height="18" rx="4" fill="#FF3C8E"/><rect x="116" y="64" width="10" height="18" rx="4" fill="#FF3C8E"/>':'')+
 (/chain|gold/.test(item)?'<path d="M72 112 Q90 140 108 112" stroke="#F5C542" stroke-width="5" fill="none"/>':'')+
 (/guitar/.test(item)?'<rect x="122" y="150" width="8" height="70" fill="#7a4b22" transform="rotate(-30 126 185)"/><ellipse cx="140" cy="212" rx="18" ry="22" fill="#c08a4a"/>':'')+
 (/mic/.test(item)||!item?'<rect x="140" y="104" width="6" height="22" fill="#333"/><circle cx="143" cy="100" r="8" fill="#ccc"/>':'')+
 '</g></svg>';
 return svg}
function avatar(small){var cap=esc([val('hair'),val('look'),val('item'),isHybrid()?S.cyborg+'% cyborg':'',isHybrid()?val('planet'):''].filter(Boolean).join(', '));
 var art=S.avImg?'<img src="'+esc(S.avImg)+'" alt="Full-body avatar of '+esc(S.name)+'" style="width:100%;max-width:'+(small?160:260)+'px;aspect-ratio:9/16;object-fit:cover;border-radius:12px;display:block;margin:0 auto">':svgAvatar();
 return '<div class="avatar" aria-label="Full-body avatar">'+art+(small?'':'<div style="margin-top:6px">'+cap+'</div><div style="opacity:.8;margin-top:4px">'+(S.avImg?'AI avatar'+(S.avBlend?' blended with your photo':'')+'.':'Drawn avatar from your picks. Tap Make my AI avatar for the full art.')+'</div>')+'</div>'}
function shrinkPhoto(cb){if(!S.photo||S.label!=='AI assisted'||!S.photoOk)return cb('');var im=new Image();im.onload=function(){var sc=Math.min(1,512/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.8))};im.onerror=function(){cb('')};im.src=S.photo}
function makeAvatar(btn){var COST=60,st=document.getElementById('avst');if(S.credits<COST){st.textContent='Not enough credits.';return}btn.disabled=true;S.credits-=COST;hud();st.textContent='Drawing your full-body avatar...';
 shrinkPhoto(function(ph){var p=payload();p.photo=ph;p.photoOk=S.photoOk;
 fetch('/api/song-helper?action=epk-avatar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}).then(function(r){return r.json().catch(function(){return{}})}).then(function(d){
  if(!d||!d.image){S.credits+=COST;hud();toast('Credits refunded');btn.disabled=false;st.innerHTML=esc((d&&(d.notice||d.error))||'The avatar did not come back.')+' Credits refunded automatically.';return}
  S.avImg=d.image;S.avBlend=!!d.blended;coin(20);stepPrize();toast('Avatar unlocked!');if(d.notice){var s2=document.getElementById('avst');if(s2)s2.textContent=d.notice}
 }).catch(function(){S.credits+=COST;hud();btn.disabled=false;st.textContent='Network hiccup. Credits refunded automatically.'})})}
function stepPrize(){var e=S.epk,n=esc(S.name);
 var links=S.links.split(/\n+/).filter(Boolean).map(function(l){var u=l.trim();var href=u[0]==='@'?'':u;return '<li>'+(href?'<a href="'+esc(href)+'" style="color:inherit">'+esc(u)+'</a>':esc(u))+'</li>'}).join('');

 app.innerHTML='<section class="card"><div class="lvl noprint">Level 10: Prize Ticket</div><h1 class="noprint">Your EPK is ready</h1>'+
 '<div class="noprint" style="margin:8px 0"><button class="btn alt" id="edmode" aria-pressed="'+S.editMode+'">'+(S.editMode?'Done editing':'Edit EPK')+'</button> <button class="btn alt" id="retheme">Change theme</button></div>'+epkHtml()+
 '<button class="btn noprint" id="pdf">Print / Save as PDF</button>'+(S.avImg?'':'<button class="btn alt noprint" id="mkav">Make my AI avatar (60 credits)</button>')+'<p class="note noprint" id="avst">Failed or blank avatars refund your credits automatically.</p></section>'+
 '<section class="card noprint"><h2>Social package</h2>'+(S.avImg?'<div style="max-width:200px">'+avatar(true)+'<a class="btn alt" download="'+n+'-avatar.jpg" href="'+esc(S.avImg)+'">Download avatar</a></div>':'')+caps.map(function(c,i){return '<div class="fact"><span>'+esc(c)+'</span><button class="chip copy" data-i="'+i+'">Copy</button></div>'}).join('')+'</section>'+
 '<section class="card noprint"><h2>Trading card</h2><div class="tcard" id="tcard"><div class="row"><span>'+n+'</span><span>LVL '+Math.max(1,Math.floor(S.coins/50))+'</span></div>'+avatar(true)+
 '<div class="badge">'+esc(S.label)+'</div><div style="font-size:12px;margin:4px 0">'+esc(val('genre'))+' / '+esc(val('voice'))+'</div>'+Object.keys(S.stats).map(function(k){return '<div class="row"><span>'+k+'</span><span>'+S.stats[k]+'/10</span></div>'}).join('')+'<div style="font-size:12px;margin-top:6px">Power: '+esc(val('superpower')||'Mystery')+'</div></div></section>'+
 '<section class="card noprint"><h2>Did you like it?</h2><button class="btn" id="thumb" aria-label="Thumbs up">👍 Thumbs up</button><span id="thx" class="note"></span>'+

 '<button class="btn alt" id="restart">Plai again</button></section>';
 document.getElementById('pdf').onclick=function(){window.print()};wireEdit();document.getElementById('edmode').onclick=function(){if(S.editMode)document.querySelectorAll('#epk [data-edit]').forEach(function(x){S.edit[x.dataset.edit]=x.innerText.trim()});S.editMode=!S.editMode;stepPrize()};document.getElementById('retheme').onclick=function(){go(STEPS.indexOf(stepSkin))};var mk=document.getElementById('mkav');if(mk)mk.onclick=function(){makeAvatar(mk)};

 document.getElementById('thumb').onclick=function(){document.getElementById('thx').textContent=' Thanks! +10 coins';coin(10)};

  .then(function(r){return r.json().catch(function(){return{}}).then(function(d){st.textContent=r.ok?'Ticket sent. We will look at it soon.':((d&&d.error)||'Could not send. Try again.')})}).catch(function(){st.textContent='Could not send. Try again.'})};
}
